{{ if isset .Site.Params.widgets "search" }}
{{ if .Site.Params.widgets.search }}
<div class="panel panel-default sidebar-menu">

    <div class="panel-heading">
      <h3 class="panel-title">{{ i18n "searchTitle" }}</h3>
    </div>

    <div class="panel-body">
        <form action="//google.com/search" method="get" accept-charset="UTF-8" role="search" aria-label="사이트 내 검색">
            <div class="input-group">
                <input type="search" name="q" aria-label="사이트 내 검색어" class="form-control" placeholder="{{ i18n "searchTitle" }}" />
                <input type="hidden" name="sitesearch" value="{{ "/" | absURL }}" />
                <span class="input-group-btn">
                    <button type="submit" class="btn btn-template-main" aria-label="사이트 내 검색 실행"><i class="fas fa-search" aria-hidden="true"></i></button>
                </span>
            </div>
        </form>
    </div>
</div>
{{ end }}
{{ end }}
