baseurl = "https://fromlatony-wodhksqq.github.io/bp-ProfilePage/"
title = "jaewa__n"
timeZone = "Asia/Seoul"


languageCode = "ko-KR"
# Site language. Available translations in the theme's `/i18n` directory.
defaultContentLanguage = "ko"

# number of words of summarized post content (default 70)
summaryLength = 70

# not pluralize title pages by default
pluralizelisttitles = false

[services]
    # Enable comments by entering your Disqus shortname
    [services.disqus]
        shortname = ""
    # Enable Google Analytics by entering your tracking code
    [services.googleAnalytics]
        id = ""

# Define the number of posts per page
[pagination]
    pagerSize = 10

# Main menu
[menu]
[[menu.main]]
    name = "Home"
    identifier = "menu.home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Profile"
    identifier = "menu.profile"
    url = "/faq/"
    weight = 2

[[menu.main]]
    name = "Post"
    identifier = "menu.post"
    url = "/blog/"
    weight = 3

[[menu.main]]
    name = "Hobby"
    identifier = "menu.hobby"
    url = "/hobby/"
    weight = 4

[[menu.main]]
    name = "Contact"
    identifier = "contact"
    url = "/contact/"
    weight = 5

[params]
    viewMorePostLink = "/blog/"
    author = "jaewa__n"
    defaultKeywords = ["최재완", "jaewa__n", "개발", "AI agent", "Python", "C++", "React"]
    mainSections = ["blog"]
    defaultDescription = "개발과 AI agent를 공부하는 최재완의 개인 소개와 활동 기록입니다."

    # Social media
    facebook_site = "" # the Facebook handle of your site ('https://www.facebook.com/HANDLE')
    twitter_site = "" # 본인 X 계정을 연결할 때 입력
    default_sharing_image = "img/sharing-default.png"

    # 지도 기능을 사용하지 않으므로 외부 연결과 데모 위치를 비워 둡니다.
    enableGoogleMaps = false
    googleMapsApiKey = ""

    latitude = ""
    longitude = ""

    # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "default"

    # 실제 문의 수신처를 연결하기 전까지 Formspree 설정을 두지 않습니다.
    # 테마는 formspree_action 키가 있을 때 폼을 출력하므로 빈 값 대신 생략합니다.
    contact_form_ajax = false
    enableRecaptchaInContactForm = false
    googleRecaptchaKey = ""

    about_us = """
    <p>개발과 AI agent를 공부하는 최재완입니다. 현재에 늘 최선을 다하며, 후회를 남기지 않는 사람이 되고 싶습니다.</p>
    <h3>관심 분야와 이유</h3>
    <p>구상한 아이디어를 코드로 구현하고 수익화까지 이어갈 수 있다는 점에서 개발에 매력을 느꼈습니다.</p>
    <p>AI agent를 더 깊이 활용하면서 개선할 부분들이 눈에 보여 관심을 갖게 되었습니다. 이를 계기로 AI agent를 깊이 공부하고 직접 개선하는 방향으로 나아가고 싶습니다.</p>
    """
    copyright = "© 2026 최재완 · jaewa__n"

    # Format dates with Go's time formatting
    date_format = "2006년 1월 2일"

    dropdown_mouse_over = false

    disabled_logo = true
    logo_text = "jaewa__n"

    logo = "img/logo.png"
    logo_small = "img/logo-small.png"
    contact_url = "/contact"
    address = """<p class="text-uppercase"><strong>최재완 · jaewa__n</strong>
        <br>개발 · AI agent
        <br><a href="https://github.com/FromLAtoNY-wodhksqq">GitHub 프로필 보기</a>
      </p>
      """

[permalinks]
    blog = "/blog/:year/:month/:day/:contentbasename/"

# Enable or disable top bar with social icons
[params.topbar]
    enable = false
    text = ""

# Enable and disable widgets for the right sidebar
[params.widgets]
    categories = true
    tags = true
    search = true

[params.carouselCustomers]
    items = 6
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselTestimonials]
    items = 4
    auto_play = false
    slide_speed = 2000
    pagination_speed = 1000

[params.carouselHomepage]
    # All carousel items are defined in their own files. You can find example items
    # at 'exampleSite/data/carousel'.
    # For more information take a look at the README.
    enable = true
    auto_play = true
    slide_speed = 2000
    pagination_speed = 1000

[params.features]
    enable = true
    cols = 3 # Default: 3, Available values 2,3,4,6
    # All features are defined in their own files. You can find example items
    # at 'exampleSite/data/features'.
    # For more information take a look at the README.

[params.testimonials]
    enable = false
    # All testimonials are defined in their own files. You can find example items
    # at 'exampleSite/data/testimonials'.
    # For more information take a look at the README.
    title = "Testimonials"
    subtitle = "We have worked with many clients and we always like to hear they come out from the cooperation happy and satisfied. Have a look what our clients said about us."

[params.see_more]
    enable = false
    icon = "far fa-file-alt"
    title = "Do you want to see more?"
    subtitle = "We have prepared for you more than 40 different HTML pages, including 5 variations of homepage."
    link_url = "#"
    link_text = "Check other homepages"

[params.clients]
    enable = false
    # All clients are defined in their own files. You can find example items
    # at 'exampleSite/data/clients'.
    # For more information take a look at the README.
    title = "Our Clients"
    subtitle = ""

[params.recent_posts]
    enable = true
    title = "Post"
    subtitle = "과정 수강, 해커톤 수상, 행사 참가, 프로그램 개발과 연구 활동을 기록합니다."
    hide_summary = false

[params.footer.recent_posts]
    enable = true

[taxonomies]
    category = "categories"
    tag = "tags"
    author = "authors"
